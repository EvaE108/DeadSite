<!DOCTYPE html>
<html>
<head>
  <title></title>

  <style>
    body {
      background-color: black;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, serif;
    }

    .puzzle-row {
      display: flex;
      gap: 28px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .box {
      width: 120px;
      height: 150px;
      border: 1px solid #333;
      background-color: #050505;
      box-shadow: 0 0 14px #250000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .question {
      color: #aaa;
      font-size: 3rem;
      text-shadow: 0 0 10px darkred;
    }

    button {
      background-color: #090909;
      color: white;
      border: 1px solid #555;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 0 8px #300;
    }

    button:hover {
      background-color: #250000;
      box-shadow: 0 0 14px darkred;
    }
  </style>
</head>

<body>

  <div class="puzzle-row">
    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(0)">▶</button>
    </div>

    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(1)">▶</button>
    </div>

    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(2)">▶</button>
    </div>

    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(3)">▶</button>
    </div>

    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(4)">▶</button>
    </div>
  </div>

  <script>
  const clickPositions = [0, 0, 0, 0, 0];

  const boxes = [
    {
      file: "note1.mp3",
      playbackRates: [1.0, 0.8, 0.65]
    },
    {
      file: "note2.mp3",
      playbackRates: [1.0]
    },
    {
      file: "note3.mp3",
      playbackRates: [1.0]
    },
    {
      file: "note4.mp3",
      playbackRates: [1.0]
    },
    {
      file: "note2.mp3",
      playbackRates: [1.0]
    }
  ];

  function playBox(boxIndex) {
    const box = boxes[boxIndex];
    const currentPosition = clickPositions[boxIndex];

    const audio = new Audio(box.file);

    audio.playbackRate = box.playbackRates[currentPosition];
    audio.volume = 0.9;

    audio.play().catch(function(error) {
      console.log("Audio failed:", error);
    });

    clickPositions[boxIndex]++;

    if (clickPositions[boxIndex] >= box.playbackRates.length) {
      clickPositions[boxIndex] = 0;
    }
  }
</script>

</body>
</html>
