<!DOCTYPE html>
<html>
<head>
  <title></title>

  <style>
    body {
      background-color: black;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, serif;
    }

    .puzzle-row {
      display: flex;
      gap: 28px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .box {
      width: 120px;
      height: 150px;
      border: 1px solid #333;
      background-color: #050505;
      box-shadow: 0 0 14px #250000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .question {
      color: #aaa;
      font-size: 3rem;
      text-shadow: 0 0 10px darkred;
    }

    button {
      background-color: #090909;
      color: white;
      border: 1px solid #555;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 0 8px #300;
    }

    button:hover {
      background-color: #250000;
      box-shadow: 0 0 14px darkred;
    }
  </style>
</head>

<body>

  <div class="puzzle-row">
    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(0)">▶</button>
    </div>

    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(1)">▶</button>
    </div>

    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(2)">▶</button>
    </div>

    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(3)">▶</button>
    </div>

    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(4)">▶</button>
    </div>
  </div>

  <script>
    let audioContext;
    const loadedSounds = {};
    const clickPositions = [0, 0, 0, 0, 0];

    const boxes = [
      {
        file: "note1.mp3",
        steps: ["normal", "left", "leftMore"]
      },
      {
        file: "note2.mp3",
        steps: ["normal"]
      },
      {
        file: "note3.mp3",
        steps: ["normal"]
      },
      {
        file: "note4.mp3",
        steps: ["normal"]
      },
      {
        file: "note2.mp3",
        steps: ["normal"]
      }
    ];

    async function setupAudio() {
      if (!audioContext) {
        audioContext = new AudioContext();
      }
    }

    async function loadSound(fileName) {
      await setupAudio();

      if (loadedSounds[fileName]) {
        return loadedSounds[fileName];
      }

      const response = await fetch(fileName);
      const arrayBuffer = await response.arrayBuffer();
      const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

      loadedSounds[fileName] = audioBuffer;
      return audioBuffer;
    }

    async function playBox(boxIndex) {
      const box = boxes[boxIndex];
      const currentPosition = clickPositions[boxIndex];
      const currentStep = box.steps[currentPosition];

      await playChangedSound(box.file, currentStep);

      clickPositions[boxIndex]++;

      if (clickPositions[boxIndex] >= box.steps.length) {
        clickPositions[boxIndex] = 0;
      }
    }

    async function playChangedSound(fileName, type) {
      const buffer = await loadSound(fileName);

      const source = audioContext.createBufferSource();
      const gainNode = audioContext.createGain();

      source.buffer = buffer;

      const now = audioContext.currentTime;

      if (type === "normal") {
        source.playbackRate.value = 1;
        gainNode.gain.setValueAtTime(0.75, now);
      }

      if (type === "left") {
        source.playbackRate.value = 0.8;
        gainNode.gain.setValueAtTime(0.75, now);
      }

      if (type === "leftMore") {
        source.playbackRate.value = 0.65;
        gainNode.gain.setValueAtTime(0.75, now);
      }

      if (type === "right") {
        source.playbackRate.value = 1.25;
        gainNode.gain.setValueAtTime(0.75, now);
      }

      if (type === "rightMore") {
        source.playbackRate.value = 1.45;
        gainNode.gain.setValueAtTime(0.75, now);
      }

      if (type === "up") {
        source.playbackRate.value = 1;
        gainNode.gain.setValueAtTime(0.25, now);
        gainNode.gain.linearRampToValueAtTime(1.0, now + 0.5);
      }

      if (type === "down") {
        source.playbackRate.value = 1;
        gainNode.gain.setValueAtTime(1.0, now);
        gainNode.gain.linearRampToValueAtTime(0.15, now + 0.5);
      }

      source.connect(gainNode);
      gainNode.connect(audioContext.destination);

      source.start();
    }
  </script>

</body>
</html>
