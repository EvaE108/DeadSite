<!DOCTYPE html>
<html>
<head>
  <title></title>

  <style>
    body {
      background-color: black;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, serif;
    }

    .puzzle-row {
      display: flex;
      gap: 28px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .box {
      width: 120px;
      height: 150px;
      border: 1px solid #333;
      background-color: #050505;
      box-shadow: 0 0 14px #250000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .question {
      color: #aaa;
      font-size: 3rem;
      text-shadow: 0 0 10px darkred;
    }

    button {
      background-color: #090909;
      color: white;
      border: 1px solid #555;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 0 8px #300;
    }

    button:hover {
      background-color: #250000;
      box-shadow: 0 0 14px darkred;
    }
  </style>
</head>

<body>

  <div class="puzzle-row">
    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(0)">▶</button>
    </div>

    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(1)">▶</button>
    </div>

    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(2)">▶</button>
    </div>

    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(3)">▶</button>
    </div>

    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(4)">▶</button>
    </div>

    <div class="box">
      <div class="question">?</div>
      <button onclick="playBox(5)">▶</button>
    </div>
  </div>

  <script>
    const clickPositions = [0, 0, 0, 0, 0, 0];

    /*
      note1.mp3 = F
      note2.mp3 = G
      note3.mp3 = A
      note4.mp3 = D

      Each box cycles through its sounds every time it is clicked.
    */
    const boxes = [
      // Box 1: F, then E, then D
      {
        file: "note1.mp3",
        steps: [
          { rate: 1.0, effect: "normal" },        // F
          { rate: 0.943874, effect: "normal" },   // E
          { rate: 0.840896, effect: "normal" }    // D
        ]
      },

      // Box 2: G, then F, then E, then volume down
      {
        file: "note2.mp3",
        steps: [
          { rate: 1.0, effect: "normal" },        // G
          { rate: 0.890899, effect: "normal" },   // F
          { rate: 0.840896, effect: "normal" },   // E
          { rate: 0.840896, effect: "down" }      // volume down dramatically
        ]
      },

      // Box 3: A, then B, then C, then D, then volume up
      {
        file: "note3.mp3",
        steps: [
          { rate: 1.0, effect: "normal" },        // A
          { rate: 1.122462, effect: "normal" },   // B
          { rate: 1.189207, effect: "normal" },   // C
          { rate: 1.334840, effect: "normal" },   // D
          { rate: 1.334840, effect: "up" }        // volume up dramatically
        ]
      },

      // Box 4: D, then E
      {
        file: "note4.mp3",
        steps: [
          { rate: 1.0, effect: "normal" },        // D
          { rate: 1.122462, effect: "normal" }    // E
        ]
      },

      // Box 5: A only
      {
        file: "note3.mp3",
        steps: [
          { rate: 1.0, effect: "normal" }         // A
        ]
      },

      // Box 6: G, then volume down, then A, then B
      {
        file: "note2.mp3",
        steps: [
          { rate: 1.0, effect: "normal" },        // G
          { rate: 1.0, effect: "down" },          // volume down dramatically
          { rate: 1.122462, effect: "normal" },   // A
          { rate: 1.259921, effect: "normal" }    // B
        ]
      }
    ];

    function playBox(boxIndex) {
      const box = boxes[boxIndex];
      const currentPosition = clickPositions[boxIndex];
      const step = box.steps[currentPosition];

      const audio = new Audio(box.file);

      // This is the important part that lets playbackRate actually change the pitch
      audio.preservesPitch = false;
      audio.mozPreservesPitch = false;
      audio.webkitPreservesPitch = false;

      audio.playbackRate = step.rate;

      if (step.effect === "normal") {
        audio.volume = 0.9;
      }
      else if (step.effect === "down") {
        audio.volume = 1.0;
        fadeVolume(audio, 1.0, 0.02, 800);
      }
      else if (step.effect === "up") {
        audio.volume = 0.03;
        fadeVolume(audio, 0.03, 1.0, 800);
      }

      audio.play().catch(function(error) {
        console.log("Audio failed:", error);
      });

      clickPositions[boxIndex]++;

      if (clickPositions[boxIndex] >= box.steps.length) {
        clickPositions[boxIndex] = 0;
      }
    }

    function fadeVolume(audio, startVolume, endVolume, duration) {
      const startTime = Date.now();

      const fade = setInterval(function() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);

        audio.volume = startVolume + (endVolume - startVolume) * progress;

        if (progress >= 1) {
          clearInterval(fade);
        }
      }, 30);
    }
  </script>

</body>
</html>
