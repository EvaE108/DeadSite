<!DOCTYPE html>
<html>
<head>
  <title></title>

  <style>
    body {
      background-color: black;
      color: white;
      font-family: Georgia, serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .puzzle-row {
      display: flex;
      gap: 24px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      padding: 2rem;
    }

    .box {
      width: 120px;
      height: 160px;
      border: 1px solid #333;
      background-color: #050505;
      box-shadow: 0 0 14px #250000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
    }

    .blank {
      width: 55px;
      height: 55px;
      border-bottom: 2px solid #777;
    }

    button {
      background-color: #090909;
      color: white;
      border: 1px solid #555;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 1.2rem;
      box-shadow: 0 0 8px #300;
    }

    button:hover {
      background-color: #250000;
      box-shadow: 0 0 14px darkred;
    }

    .path {
      color: #aaa;
      font-size: 1.5rem;
      letter-spacing: 4px;
      min-height: 30px;
    }
  </style>
</head>

<body>

  <div class="puzzle-row">

    <div class="box">
      <div class="blank"></div>
      <button onclick="playSound(0)">▶</button>
      <div class="path">← ←</div>
    </div>

    <div class="box">
      <div class="blank"></div>
      <button onclick="playSound(1)">▶</button>
      <div class="path">← ← ↓</div>
    </div>

    <div class="box">
      <div class="blank"></div>
      <button onclick="playSound(2)">▶</button>
      <div class="path">→ → → ↑</div>
    </div>

    <div class="box">
      <div class="blank"></div>
      <button onclick="playSound(3)">▶</button>
      <div class="path">↑</div>
    </div>

    <div class="box">
      <div class="blank"></div>
      <button onclick="playSound(4)">▶</button>
      <div class="path">•</div>
    </div>

    <div class="box">
      <div class="blank"></div>
      <button onclick="playSound(5)">▶</button>
      <div class="path">↓ → →</div>
    </div>

  </div>

  <script>
    const sounds = [
      "note1.mp3",
      "note2.mp3",
      "note3.mp3",
      "note4.mp3",
      "note3.mp3",
      "note2.mp3"
    ];

    function playSound(index) {
      const audio = new Audio(sounds[index]);
      audio.volume = 0.9;
      audio.play();
    }
  </script>

</body>
</html>
